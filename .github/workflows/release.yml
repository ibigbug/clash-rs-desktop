# Builds the Windows installer and Linux packages and publishes them on both
# this repo (which keeps the release history) and the public distribution
# repo (a fork of this one, where users download from).
#
# - Push to master: a nightly build. The `nightly` pre-release (and tag) on
#   both repos always holds the newest master build, under fixed file names.
#   A newer push cancels a nightly build still in progress.
# - Push a tag `vX.Y.Z` (must match the app version): the same tag is created
#   on the distribution repo and the release is published on both repos.
# - Run the workflow by hand: a test build of the current commit goes to a
#   draft release named `test-build` on this repo only (no tag, replaced on
#   every run).
#
# Needs the secret `WATFAQ_RELEASE_PAT`: a fine-grained token for the
# distribution repo only, with "Contents" and "Workflows" read and write
# (syncing the fork needs Workflows whenever a workflow file changed).
name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# One run per kind of build. A newer master push or manual run cancels the
# one still in progress instead of queueing behind it; tag releases never
# cancel each other (each tag is its own group anyway).
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REPO: Watfaq-legacy/clash-rs-desktop

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.version.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Secret WATFAQ_RELEASE_PAT is missing (see the top of this file)"
            exit 1
          fi
      - id: version
        name: Decide what to build
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"
              exit 1
            fi
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
            # Shown in Settings → About instead of the plain version.
            echo "build=$version-nightly.$(date -u +%Y%m%d)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=test" >> "$GITHUB_OUTPUT"
            echo "build=$version-test+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      CHOCLITE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even if bundling fails later.
          cache-on-failure: true
      - name: Build installer
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm bundle:windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    env:
      CHOCLITE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even if bundling fails later.
          cache-on-failure: true
      - name: Build packages
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm bundle:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      # Releases and tags on this repo use the built-in token.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sync the distribution repo
        if: needs.version.outputs.kind != 'test'
        env:
          GH_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
        # Fast-forward the fork so tags and releases can point at this commit.
        run: gh api -X POST "repos/$RELEASE_REPO/merge-upstream" -f branch=master
      - name: Publish
        env:
          MAIN_TOKEN: ${{ github.token }}
          DIST_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # Multi-path artifacts keep their bundle/<kind>/ folders; flatten.
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -delete
          if [[ "$KIND" == nightly ]]; then
            # Fixed names, so the download links always give the newest build.
            for f in dist/*; do mv "$f" "${f/_${VERSION}_/_nightly_}"; done
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

          # Point a tag at this commit (force: a re-run or the next nightly
          # moves it). Uses GH_REPO / GH_TOKEN of the current target.
          move_tag() {
            local ref="repos/$GH_REPO/git/refs/tags/$1"
            if gh api "$ref" >/dev/null 2>&1; then
              # The built-in token may be refused when the move crosses a
              # workflow file change; deleting and recreating is allowed.
              gh api -X PATCH "$ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
                { echo "Moving $1 was refused; recreating it"; gh api -X DELETE "$ref"; }
            fi
            if ! gh api "$ref" >/dev/null 2>&1; then
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$1" -f sha="$GITHUB_SHA" >/dev/null
            fi
          }

          publish() {
            echo "::group::Publishing $KIND to $GH_REPO"
            case "$KIND" in
              test)
                gh release delete test-build --yes 2>/dev/null || true
                gh release create test-build dist/* --draft --target "$GITHUB_SHA" \
                  --title "Test build $BUILD" --notes "Built by hand from $GITHUB_SHA. Not a release."
                ;;
              nightly)
                move_tag nightly
                notes="Latest build of master: $BUILD ($GITHUB_SHA). Built automatically on every push; may be unstable."
                if gh release view nightly >/dev/null 2>&1; then
                  gh release upload nightly dist/* --clobber
                  gh release edit nightly --title "Nightly ($BUILD)" --notes "$notes" --prerelease --latest=false --draft=false
                else
                  gh release create nightly dist/* --verify-tag --prerelease --latest=false \
                    --title "Nightly ($BUILD)" --notes "$notes"
                fi
                ;;
              release)
                tag="v$VERSION"
                move_tag "$tag"
                if gh release view "$tag" >/dev/null 2>&1; then
                  gh release upload "$tag" dist/* --clobber
                  gh release edit "$tag" --draft=false --tag "$tag"
                else
                  gh release create "$tag" dist/* --verify-tag --title "Choclite $tag" --generate-notes
                fi
                ;;
            esac
            echo "::endgroup::"
          }

          # This repo keeps the full release history, so it survives if the
          # distribution fork is ever removed; the fork is what users see.
          # Test builds are for us only and stay here.
          GH_REPO="$GITHUB_REPOSITORY" GH_TOKEN="$MAIN_TOKEN" publish
          if [[ "$KIND" != test ]]; then
            GH_REPO="$RELEASE_REPO" GH_TOKEN="$DIST_TOKEN" publish
          fi
