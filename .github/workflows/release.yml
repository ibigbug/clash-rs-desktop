# Builds the Windows installer and Linux packages and publishes them on the
# public distribution repo (a fork of this one).
#
# - Push a tag `vX.Y.Z` (must match the app version): the same tag is created
#   on the distribution repo and the release is published.
# - Run the workflow by hand: a test build of the current commit goes to a
#   draft release named `test-build` (no tag, replaced on every run).
#
# Needs the secret `WATFAQ_RELEASE_PAT`: a fine-grained token for the
# distribution repo only, with "Contents" and "Workflows" read and write
# (syncing the fork needs Workflows whenever a workflow file changed).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REPO: Watfaq-legacy/clash-rs-desktop

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Secret WATFAQ_RELEASE_PAT is missing (see the top of this file)"
            exit 1
          fi
      - id: version
        name: Read the app version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even if bundling fails later.
          cache-on-failure: true
      - name: Build installer
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm bundle:windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even if bundling fails later.
          cache-on-failure: true
      - name: Build packages
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm bundle:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sync the distribution repo
        env:
          GH_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
        # Fast-forward the fork so the release can point at this commit.
        run: gh api -X POST "repos/$RELEASE_REPO/merge-upstream" -f branch=master
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.WATFAQ_RELEASE_PAT }}
          GH_REPO: ${{ env.RELEASE_REPO }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Multi-path artifacts keep their bundle/<kind>/ folders; flatten.
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -delete
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            gh release delete test-build --yes 2>/dev/null || true
            gh release create test-build dist/* --draft --target "$GITHUB_SHA" \
              --title "Test build $TAG (${GITHUB_SHA::7})" \
              --notes "Built by hand from $GITHUB_SHA. Not a release."
            exit 0
          fi

          # Same tag as here, on the same commit (force: a re-run may move it).
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --tag "$TAG"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Choclite $TAG" --generate-notes
          fi
